name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libomp-18-dev libbenchmark-dev
      - name: Install Python package and development tools
        run: python -m pip install -c constraints.txt -e '.[dev,postgres]'
      - name: Check Python formatting and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check generated message contracts
        run: python tools/generate_contracts.py --check
      - name: Test contracts, storage, and service runtime
        run: python -m pytest tests/test_contracts.py tests/test_storage.py tests/test_cloud_storage.py tests/test_postgres_storage.py tests/test_runtime.py tests/test_dispatch.py tests/test_transfer.py tests/test_fleet.py tests/test_baseline.py tests/test_sandbox.py tests/test_domains.py tests/test_measurement_tools.py tests/test_verification.py tests/test_benchmark.py tests/test_pipeline.py tests/test_agents.py tests/test_selection.py tests/test_recovery.py tests/test_execution_entrypoints.py tests/test_concurrency.py tests/test_agent_rpc.py tests/test_model_adapter.py tests/test_transformations.py tests/test_llvm_ir.py tests/test_debate.py tests/test_observability.py tests/test_action_o.py tests/test_action_p.py -m "not docker" tests/test_targets.py tests/test_cuda_compile.py tests/test_action_n.py tests/test_evaluation.py tests/test_infra.py
      - name: Check C formatting
        run: clang-format --dry-run --Werror examples/sum-array/main.c examples/sum-array-optimized/main.c examples/sum-array-buffered/main.c docker/measure.c docker/perf.h examples/parallel-sum/main.cpp examples/benchmarks/sum_benchmark.cpp
      - name: Configure and build trusted example
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_KERNEL_BENCHMARKS=ON -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build --parallel
      - name: Test example fixtures
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Build Python distributions
        run: python -m build
      - name: Verify installed wheel outside source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import compiler_optimizer.coordinator, compiler_optimizer.agents, compiler_optimizer.scheduler, compiler_optimizer.workers, compiler_optimizer.monitoring, compiler_optimizer.shared'
          python -c 'from compiler_optimizer.shared.manifest import parse_manifest; from compiler_optimizer.shared.v1 import contracts_pb2_grpc'
          python -c 'import tempfile; from compiler_optimizer.storage import Repository; temporary = tempfile.TemporaryDirectory(); assert Repository(temporary.name).list_tasks() == []; temporary.cleanup()'

  clean-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libomp-18-dev libbenchmark-dev
      - name: Package tracked source and reproduce outside checkout
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          python tools/project.py package --output /tmp/optimizer-source.tar.gz
          python tools/reproduction.py --check /tmp/optimizer-source.tar.gz

  infrastructure:
    # Static checks only: no AWS credentials are available or needed here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Terraform formatting, validation and environment settings
        run: python tools/infra.py check

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optimizer
          POSTGRES_PASSWORD: optimizer-ci
          POSTGRES_DB: optimizer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U optimizer -d optimizer_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CC: clang-18
      CXX: clang++-18
      PGPASSWORD: optimizer-ci
      TEST_POSTGRES_URL: postgresql://optimizer@127.0.0.1:5432/optimizer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libomp-18-dev libbenchmark-dev
      - name: Install Python package with the PostgreSQL driver
        run: python -m pip install -c constraints.txt -e '.[dev,postgres]'
      - name: Run the storage-backed suite on PostgreSQL
        run: python -m pytest tests/test_contracts.py tests/test_storage.py tests/test_cloud_storage.py tests/test_postgres_storage.py tests/test_runtime.py tests/test_dispatch.py tests/test_transfer.py tests/test_fleet.py tests/test_baseline.py tests/test_sandbox.py tests/test_domains.py tests/test_measurement_tools.py tests/test_verification.py tests/test_benchmark.py tests/test_pipeline.py tests/test_agents.py tests/test_selection.py tests/test_recovery.py tests/test_execution_entrypoints.py tests/test_concurrency.py tests/test_agent_rpc.py tests/test_model_adapter.py tests/test_transformations.py tests/test_llvm_ir.py tests/test_debate.py tests/test_observability.py tests/test_action_o.py tests/test_action_p.py -m "not docker" tests/test_targets.py tests/test_cuda_compile.py tests/test_action_n.py tests/test_evaluation.py tests/test_infra.py

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start local infrastructure
        run: docker compose up --detach --build --wait --wait-timeout 240
      - name: Check application readiness
        run: python tools/check_stack.py
      - name: Validate monitoring stack and alert rules
        run: |
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose exec -T prometheus promtool test rules /etc/prometheus/alerts.test.yml
          python tools/check_observability.py
      - name: Build Linux x86-64 Clang 18 toolchain
        run: |
          docker compose --profile toolchain build compiler
          docker compose --profile riscv build compiler-riscv
          docker compose --profile cuda-compile build compiler-cuda
      - name: Install baseline integration test dependencies
        run: python -m pip install -c constraints.txt -e . pytest
      - name: Test real containerized C/C++ baseline execution
        env:
          BASELINE_DOCKER_TESTS: "1"
          PIPELINE_INTEGRATION_TESTS: "1"
          RECOVERY_INTEGRATION_TESTS: "1"
          RISCV_DOCKER_TESTS: "1"
          CUDA_COMPILE_TESTS: "1"
          EVALUATION_DOCKER_TESTS: "1"
          CONCURRENCY_INTEGRATION_TESTS: "1"
          AGENT_INTEGRATION_TESTS: "1"
          DEBATE_INTEGRATION_TESTS: "1"
          TRANSFORMATION_INTEGRATION_TESTS: "1"
          LLVM_INTEGRATION_TESTS: "1"
        run: python -m pytest --basetemp="${RUNNER_TEMP}/compiler-optimizer-tests" tests/test_baseline_docker.py tests/test_watchdog_docker.py tests/test_verification_docker.py tests/test_benchmark_docker.py tests/test_pipeline_docker.py tests/test_dispatch_docker.py tests/test_transfer_docker.py tests/test_fleet_docker.py tests/test_agents_docker.py tests/test_selection_docker.py tests/test_recovery_docker.py tests/test_concurrency_docker.py tests/test_agent_rpc_docker.py tests/test_debate_docker.py tests/test_transformations_docker.py tests/test_llvm_ir_docker.py tests/test_failure_injection_docker.py tests/test_riscv_docker.py tests/test_cuda_compile_docker.py tests/test_evaluation_docker.py tests/test_action_p.py -m docker
      - name: Test Action L correctness domains and coverage-guided fuzzing
        env:
          BASELINE_DOCKER_TESTS: "1"
          COMPILER_IMAGE: cmpe273-clang:18
          COMPILER_TARGET: linux-x86_64
        run: python -m pytest --basetemp="${RUNNER_TEMP}/action-l-tests" tests/test_correctness_domains_docker.py -v
      - name: Test bounded parallel measurements and benchmark tools
        env:
          BASELINE_DOCKER_TESTS: "1"
          COMPILER_IMAGE: cmpe273-clang:18
          COMPILER_TARGET: linux-x86_64
        run: python -m pytest --basetemp="${RUNNER_TEMP}/action-m-tests" tests/test_measurement_tools_docker.py -v
      - name: Preserve malformed sandbox protocol evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-protocol-diagnostics
          path: |
            ${{ runner.temp }}/compiler-optimizer-tests/**/protocol-error.json
            ${{ runner.temp }}/action-l-tests/**/protocol-error.json
            ${{ runner.temp }}/action-m-tests/**/protocol-error.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Write persistent artifact
        run: |
          docker compose exec -T coordinator python -c 'from compiler_optimizer.storage import Repository; Repository("/var/lib/compiler-optimizer").artifacts.put(b"compose-persistence-check")'
      - name: Recreate application containers and verify volume
        run: |
          docker compose up --detach --force-recreate --wait --wait-timeout 120 coordinator scheduler worker
          python tools/check_stack.py
          docker compose exec -T coordinator python -c 'import hashlib; from compiler_optimizer.storage import Repository; from compiler_optimizer.shared.v1.contracts_pb2 import ArtifactRef; data = b"compose-persistence-check"; digest = hashlib.sha256(data).hexdigest(); ref = ArtifactRef(key=f"sha256/{digest[:2]}/{digest}", sha256=digest, size_bytes=len(data)); assert Repository("/var/lib/compiler-optimizer").artifacts.get(ref) == data'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop CI stack
        if: always()
        run: docker compose down --volumes
