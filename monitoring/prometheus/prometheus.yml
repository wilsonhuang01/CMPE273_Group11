global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: optimizer-services
    static_configs:
      - targets: [coordinator:8080, scheduler:8080, worker:8080]
  - job_name: optimizer-host
    static_configs:
      - targets: [host.docker.internal:18083]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
