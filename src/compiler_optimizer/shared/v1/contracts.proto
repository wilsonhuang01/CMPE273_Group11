syntax = "proto3";

package compiler_optimizer.v1;

// Field numbers must never be reused. See docs/contracts.md for semantic rules.
message Metadata {
  uint32 schema_version = 1;
  string message_id = 2;
  string task_id = 3;
  uint64 created_at_unix_ms = 4;
}

message ArtifactRef {
  string key = 1;
  string sha256 = 2;
  uint64 size_bytes = 3;
}

message ResourceLimits {
  uint32 compile_wall_seconds = 1;
  uint32 compile_memory_mib = 2;
  uint32 run_wall_seconds = 3;
  uint32 run_memory_mib = 4;
  uint32 output_kib = 5;
}

message TestCase {
  string id = 1;
  string stdin = 2;
  string expected_stdout = 3;
  repeated string args = 4;
}

message SubmissionManifest {
  uint32 schema_version = 1;
  string name = 2;
  string language = 3;
  repeated string sources = 4;
  repeated TestCase tests = 5;
  repeated string benchmark_test_ids = 6;
  ResourceLimits limits = 7;
}

message CompilerSettings {
  string executable = 1;
  string version = 2;
  string image_digest = 3;
  string language = 4;
  string target = 5;
  repeated string flags = 6;
}

// A source-only bundle. The baseline is version 1 with no parent hash.
message SourceVersion {
  uint32 version = 1;
  ArtifactRef bundle = 2;
  string parent_source_sha256 = 3;
}

message Submission {
  Metadata meta = 1;
  SubmissionManifest manifest = 2;
  ArtifactRef package = 3;
  SourceVersion source = 4;
  CompilerSettings compiler = 5;
}

enum AgentRole {
  AGENT_ROLE_UNSPECIFIED = 0;
  PERFORMANCE = 1;
  MEMORY = 2;
  CORRECTNESS = 3;
  ARCHITECTURE = 4;
  CRITIC = 5;
  BENCHMARK = 6;
}

message OptimizationRequest {
  Metadata meta = 1;
  string proposal_id = 2;
  AgentRole role = 3;
  SubmissionManifest manifest = 4;
  SourceVersion source = 5;
  CompilerSettings compiler = 6;
  optional ArtifactRef replay_patch = 7;
  // Coordinator-bound criticism for a baseline-rebased revision; untrusted data only.
  optional string revision_context_json = 8;
}

message AgentProvenance {
  uint32 schema_version = 1;
  AgentRole role = 2;
  string service_id = 3;
  string backend = 4;
  string request_sha256 = 5;
  string response_sha256 = 6;
  string release = 7;
}

message Proposal {
  Metadata meta = 1;
  string proposal_id = 2;
  AgentRole role = 3;
  SourceVersion source = 4;
  string rationale = 5;
  string transformation = 6;
  CompilerSettings compiler = 7;
  optional ArtifactRef structured_patch = 8;
  optional AgentProvenance agent_provenance = 9;
}

message VerificationJob {
  Metadata meta = 1;
  string job_id = 2;
  oneof subject {
    bool baseline = 3;
    string proposal_id = 4;
  }
  SourceVersion source = 5;
  SubmissionManifest manifest = 6;
  CompilerSettings compiler = 7;
  uint32 attempt = 8;
  uint64 deadline_unix_ms = 9;
  repeated string additional_test_ids = 10;
  optional ArtifactRef verification_plan = 11;
  optional ArtifactRef verification_inputs = 12;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  BUSY = 2;
  QUARANTINED = 3;
}

message WorkerHeartbeat {
  Metadata meta = 1;
  string worker_id = 2;
  string incarnation_id = 3;
  uint64 sequence = 4;
  WorkerState state = 5;
  optional string current_job_id = 6;
  repeated string targets = 7;
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  COMPILATION_ERROR = 1;
  OUTPUT_MISMATCH = 2;
  NONZERO_EXIT = 3;
  SIGNAL_TERMINATION = 4;
  TIMEOUT = 5;
  MEMORY_LIMIT = 6;
  OUTPUT_LIMIT = 7;
  INFRASTRUCTURE_ERROR = 8;
  UNKNOWN_FAILURE = 9;
  SANITIZER_FAILURE = 10;
}

enum FailureStage {
  FAILURE_STAGE_UNSPECIFIED = 0;
  COMPILE = 1;
  TEST = 2;
  MEASURE = 3;
  INFRASTRUCTURE = 4;
}

message FailureDetails {
  FailureReason reason = 1;
  FailureStage stage = 2;
  string message = 3;
  optional string test_id = 4;
  optional sint32 exit_code = 5;
  optional uint32 signal_number = 6;
}

message BenchmarkMeasurement {
  string test_id = 1;
  repeated double wall_seconds = 2;
  uint64 peak_memory_bytes = 3;
  uint32 warmup_runs = 4;
}

message VerificationSuccess {
  repeated string passed_test_ids = 1;
  repeated BenchmarkMeasurement benchmarks = 2;
}

message VerificationResult {
  Metadata meta = 1;
  string job_id = 2;
  string worker_id = 3;
  uint32 attempt = 4;
  oneof subject {
    bool baseline = 5;
    string proposal_id = 6;
  }
  SourceVersion source = 7;
  CompilerSettings compiler = 8;
  string hardware = 9;
  oneof outcome {
    VerificationSuccess success = 10;
    FailureDetails failure = 11;
  }
  optional ArtifactRef log = 12;
  optional ArtifactRef correctness_report = 13;
}

message Receipt {
  Metadata meta = 1;
  string accepted_message_id = 2;
}

message OptimizationQuery {
  string task_id = 1;
}

// Status API; artifacts can be retrieved through task-scoped transfer RPCs.
message OptimizationResult {
  string task_id = 1;
  string status = 2;
  string stage = 3;
  string report_json = 4;
  optional ArtifactRef report = 5;
  optional SourceVersion selected_source = 6;
}

service CoordinatorService {
  rpc SubmitSubmission(Submission) returns (Receipt);
  rpc SubmitProposal(Proposal) returns (Receipt);
  rpc GetOptimizationResult(OptimizationQuery) returns (OptimizationResult);
}

// Inputs and outputs use the agent's own task-scoped content store. No shared database.
message AgentArtifactFrame {
  oneof frame {
    ArtifactRequest header = 1;
    bytes data = 2;
  }
}
message AgentAssessmentRequest {
  Metadata meta = 1;
  AgentRole role = 2;
  Submission submission = 3;
  Proposal proposal = 4;
  VerificationJob job = 5;
  VerificationResult verification = 6;
  optional ArtifactRef benchmark_plan = 7;
}
message AgentAssessment {
  string record_json = 1;
  AgentProvenance provenance = 2;
}
message AgentPing {}
message AgentIdentity {
  AgentRole role = 1;
  string service_id = 2;
  string backend = 3;
  string release = 4;
}
service AgentService {
  rpc GenerateProposal(OptimizationRequest) returns (Proposal);
  rpc Review(AgentAssessmentRequest) returns (AgentAssessment);
  rpc PlanBenchmark(AgentAssessmentRequest) returns (AgentAssessment);
  rpc PutArtifact(stream AgentArtifactFrame) returns (ArtifactRef);
  rpc GetArtifact(ArtifactRequest) returns (stream ArtifactChunk);
  rpc Ping(AgentPing) returns (AgentIdentity);
}

service WorkerHealthService {
  rpc ReportHeartbeat(WorkerHeartbeat) returns (Receipt);
}

// Upload frames contain exactly one header followed by bounded data frames.
message PackageUploadHeader {
  Metadata meta = 1;
  ArtifactRef package = 2;
  // Empty selects the server's native CPU profile.
  string target = 3;
}

message PackageUploadFrame {
  oneof frame {
    PackageUploadHeader header = 1;
    bytes data = 2;
  }
}

message TaskArtifact {
  ArtifactRef artifact = 1;
  string kind = 2;
  string owner_id = 3;
}

message TaskArtifacts {
  string task_id = 1;
  repeated TaskArtifact artifacts = 2;
}

message ArtifactRequest {
  string task_id = 1;
  ArtifactRef artifact = 2;
}

message ArtifactChunk {
  uint64 offset = 1;
  bytes data = 2;
}

service ArtifactTransferService {
  rpc UploadPackage(stream PackageUploadFrame) returns (Receipt);
  rpc ListArtifacts(OptimizationQuery) returns (TaskArtifacts);
  rpc DownloadArtifact(ArtifactRequest) returns (stream ArtifactChunk);
}

message FleetIdentity {
  string worker_id = 1;
  string incarnation_id = 2;
  string secret = 3;
}
message FleetRegistration {
  FleetIdentity identity = 1;
  string profile_json = 2;
}
message FleetAck { bool accepted = 1; }
message FleetLease {
  string job_id = 1;
  string token = 2;
  uint64 fence = 3;
  int64 expires_ms = 4;
  int64 deadline_ms = 5;
}
message FleetHeartbeat {
  FleetIdentity identity = 1;
  uint64 sequence = 2;
  optional FleetLease active = 3;
}
message FleetPulse {
  bool lease_valid = 1;
  repeated FleetLease cleanup = 2;
}
message FleetScheduleRequest {}
message FleetDispatch {
  string job_id = 1;
  string worker_id = 2;
  uint64 fence = 3;
}
message FleetDispatches { repeated FleetDispatch jobs = 1; }
message FleetClaim {
  FleetIdentity identity = 1;
  FleetDispatch dispatch = 2;
}
message FleetAssignment {
  bool accepted = 1;
  FleetLease lease = 2;
  string task_id = 3;
  ArtifactRef input = 4;
}
message FleetAuthority {
  FleetIdentity identity = 1;
  FleetLease lease = 2;
}
message FleetResultHeader {
  FleetIdentity identity = 1;
  FleetLease lease = 2;
  ArtifactRef artifact = 3;
}
message FleetResultFrame {
  oneof frame {
    FleetResultHeader header = 1;
    bytes data = 2;
  }
}
service FleetService {
  rpc Ping(FleetScheduleRequest) returns (FleetAck);
  rpc Register(FleetRegistration) returns (FleetAck);
  rpc Heartbeat(FleetHeartbeat) returns (FleetPulse);
  rpc Schedule(FleetScheduleRequest) returns (FleetDispatches);
  rpc Claim(FleetClaim) returns (FleetAssignment);
  rpc CheckLease(FleetAuthority) returns (FleetAck);
  rpc UploadResult(stream FleetResultFrame) returns (FleetAck);
  rpc ConfirmCleanup(FleetAuthority) returns (FleetAck);
}
